name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for committed secrets (required)
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          base="${{ github.event.pull_request.base.sha }}"
          sha="${{ github.sha }}"
          if [ -n "${base}" ] && git rev-parse --quiet --verify "${base}^{commit}" >/dev/null 2>&1; then
            log_opts="${base}..${sha}"
          elif [ -n "${before}" ] && git rev-parse --quiet --verify "${before}^{commit}" >/dev/null 2>&1; then
            log_opts="${before}..${sha}"
          else
            log_opts="-1 ${sha}"
          fi
          gitleaks detect --no-banner --redact --source . --log-opts="${log_opts}"

      - name: No Arabic in commit messages (forward-only)
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          if git rev-parse --quiet --verify "${before}^{commit}" >/dev/null 2>&1; then
            range="${before}..${sha}"
          else
            range="-1 ${sha}"
          fi
          hits=$(git log --no-merges --format='%H %s%n%b' $range | grep -nP '[\x{0600}-\x{06FF}]' || true)
          if [ -n "$hits" ]; then
            echo "Arabic found in commit message(s) on this push — keep subjects/bodies English:"
            echo "$hits"
            exit 1
          fi
          echo "commit messages clean (no Arabic)"

      - name: No internal/experimental files tracked
        run: |
          set -uo pipefail
          bad=$(git ls-files | grep -iE '(^|/)(\.claude|\.agents|\.ctl|archive|_staging|_todo|scratch|prompts)/|\.ipynb$|\.pptx$|\.bak$|\.old$' || true)
          if [ -n "$bad" ]; then
            echo "Internal/experimental files are tracked (keep them git-ignored, never published):"
            echo "$bad"
            exit 1
          fi
          echo "no internal/experimental files tracked"
