name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.14

      - name: Run ruff
        run: ruff check afmco_care_profile/

      - name: Check ruff formatting
        run: ruff format --check afmco_care_profile/

      - name: Shell syntax
        run: for f in .githooks/*; do sh -n "$f" || exit 1; done
