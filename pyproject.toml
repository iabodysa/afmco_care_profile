[project]
name = "afmco_care_profile"
authors = [
    { name = "AFMCO", email = "afm@afmcoltd.com"}
]
description = "Employee profile fields for the AFMCO Helpdesk portal"
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
helpdesk = ">=1.0.0,<2.0.0"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = ["F722"]
typing-modules = ["frappe.types.DF"]
extend-select = ["W191"]
